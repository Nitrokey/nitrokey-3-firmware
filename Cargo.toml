[workspace]
members = [
    "components/*",
    "runners/embedded",
    "runners/nkpk",
    "runners/usbip",
    "utils/collect-license-info",
    "utils/gen-commands-bd",
]
resolver = "2"

[workspace.package]
version = "1.9.1"

[workspace.dependencies]
apdu-dispatch = "0.4"
ctaphid-dispatch = "0.4"
delog = "0.1"
embedded-time = "0.12"
heapless = "0.9.1"
interchange = "0.3.3"
littlefs2 = "0.8"
lpc55-hal = "0.7.1"
lpc55-pac = "0.5"
nrf52840-hal = "0.18"
nrf52840-pac = "0.12"
trussed = { version = "0.2", default-features = false }
trussed-core = "0.2"
trussed-usbip = { version = "0.3", default-features = false }
usb-device = "0.3"
usbd-ccid = "0.5"
usbd-ctaphid = "0.5"

[patch.crates-io]
# components
memory-regions = { path = "components/memory-regions" }

# unreleased libraries
p256-cortex-m4  = { git = "https://github.com/ycrypto/p256-cortex-m4.git", rev = "cdb31e12594b4dc1f045b860a885fdc94d96aee2" }
heapless  = { git = "https://github.com/rust-embedded/heapless.git", rev = "570f47c15122bffd308ef5b6cba87ea47df990d7" }
cortex-m-rtic = { git = "https://github.com/sosthene-nitrokey/rtic.git", rev = "a9e80fa9ce474cbc9af39c202aa484ad79a480cf"}
trussed-rsa-types = { git = "https://github.com/trussed-dev/trussed-rsa-backend.git", rev = "eff0db1c405d2c8a55cc0a0a2d2f79d1c3bfec53" }
trussed = { git = "https://github.com/trussed-dev/trussed.git", rev = "335194c2a70cc659fa75e7cc504846bf5796866e" }
trussed-core = { git = "https://github.com/trussed-dev/trussed.git", rev = "335194c2a70cc659fa75e7cc504846bf5796866e" }
trussed-auth-backend = { git = "https://github.com/trussed-dev/trussed-auth.git", rev = "ecd8507023cbb8cdf278a7baa087bcae398017a6" }
trussed-staging = { git = "https://github.com/trussed-dev/trussed-staging.git", rev = "81ffa3535d4bf521c89d4872a0f7a07f8d3fe267" }
trussed-chunked = { git = "https://github.com/trussed-dev/trussed-staging.git", rev = "81ffa3535d4bf521c89d4872a0f7a07f8d3fe267" }
trussed-se050-backend = { git = "https://github.com/Nitrokey/trussed-se050-backend.git", rev = "e6a3256c5902549c89dd1a2c86cceddd9bc93059" }
se05x = { git = "https://github.com/Nitrokey/se05x.git", rev = "ae95cce762d6edad4c08b683a37969b2021026bd" }
usb-device = { git = "https://github.com/sosthene-nitrokey/usb-device.git", rev = "cdfd3dd1ca9ddb9b49133595a1e7f680b216f79d" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
incremental = false
debug = true

[profile.release-thin-lto]
lto = "thin"
inherits = "release"

[profile.release.package.salty]
opt-level = 2

[profile.release-thin-lto.package.salty]
opt-level = 2
