[workspace]
members = [
    "components/*",
    "runners/embedded",
    "runners/nkpk",
    "runners/usbip",
    "utils/collect-license-info",
    "utils/gen-commands-bd",
]
resolver = "2"

[workspace.package]
version = "1.9.0"

[workspace.dependencies]
interchange = "0.3.3"
littlefs2 = "0.8"
lpc55-hal = "0.7.1"
lpc55-pac = "0.5"
nrf52840-hal = "0.18"
nrf52840-pac = "0.12"
trussed = { version = "0.2", default-features = false }
trussed-core = "0.2.3"
trussed-usbip = { version = "0.2", default-features = false }
usb-device = "0.3"
usbd-ccid = "0.5"
usbd-ctaphid = "0.5"

[patch.crates-io]
# components
memory-regions = { path = "components/memory-regions" }

# unreleased libraries
p256-cortex-m4  = { git = "https://github.com/ycrypto/p256-cortex-m4.git", rev = "cdb31e12594b4dc1f045b860a885fdc94d96aee2" }
admin-app = { git = "https://github.com/trussed-dev/admin-app.git", rev = "1680038235c7963c2e74cfc663082eec32470baf"}
opcard = { git = "https://github.com/nitrokey/opcard-rs.git", rev = "5ad5af2c8a05adb07ecde9a39e1855ce69bb723b"}

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
incremental = false
debug = true

[profile.release-thin-lto]
lto = "thin"
inherits = "release"

[profile.release.package.salty]
opt-level = 2

[profile.release-thin-lto.package.salty]
opt-level = 2
