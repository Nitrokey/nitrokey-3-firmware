[package]
name = "provisioner-app"
version = "0.1.0"
authors = ["Conor Patrick <conor@solokeys.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
apdu-app = "0.2"
ctaphid-app.workspace = true
delog.workspace = true
heapless = "0.9"
heapless-bytes.workspace = true
iso7816 = "0.2"
littlefs2-core.workspace = true
salty = "0.3"
trussed.workspace = true
trussed-core = { workspace = true, features = ["crypto-client"] }
p256-cortex-m4 = "0.1.0-alpha.6"


[features]
log-all = []
log-trace = []
log-none = []
log-info = []
log-debug = []
log-warn = []
log-error = []
