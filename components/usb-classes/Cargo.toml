[package]
name = "usb-classes"
version = "0.1.0"
edition = "2021"

[dependencies]
apdu-dispatch.workspace = true
ctaphid-dispatch.workspace = true
delog.workspace = true
embedded-time.workspace = true
heapless.workspace = true
ref-swap = "0.1.0"
trussed-core.workspace = true
usb-device.workspace = true
usbd-ccid.workspace = true
usbd-ctaphid.workspace = true
utils.path = "../utils"

# scsi
cipher = { version = "0.4", optional = true }
usbd-storage = { version = "3.0.0", features = ["bbb", "scsi"], optional = true }

[dev-dependencies]
aes = "0.8"
hex = "0.4"
hex-literal = "1"
xts-mode = "0.5"

[features]
default = []

# 512-byte CCID bulk endpoints, as required when enumerating at high speed.
highspeed-usb = ["usbd-ccid/highspeed-usb"]

# SCSI mass storage over Bulk Only Transport. The block device backing it is
# provided by the runner.
scsi = ["dep:cipher", "dep:usbd-storage"]

log-all = []
log-none = []
log-trace = []
log-debug = []
log-info = []
log-warn = []
log-error = []
