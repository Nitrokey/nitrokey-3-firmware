[package]
name = "usb-classes"
version = { workspace = true }
edition = "2021"

[dependencies]
apdu-dispatch = "0.4"
ctaphid-dispatch = "0.4"
delog.workspace = true
embedded-time = "0.12"
heapless = "0.9"
ref-swap = "0.1.0"
trussed-core = "0.2"
usb-device = "0.3.2"
usbd-ccid = "0.5"
usbd-ctaphid = "0.5"
stm32n657-hal = { path = "../stm32n657-hal", optional = true }

# storage
cipher = { version = "0.4", optional = true }
usbd-storage = { version = "3.0.0", features = ["bbb", "scsi"], optional = true }
xts-mode = { version = "0.5", optional = true, default-features = false }

[dev-dependencies]
aes = "0.8"

[features]
default = ["stm32n657", "storage"]

# 512-byte CCID bulk endpoints, as required when enumerating at high speed.
highspeed-usb = ["usbd-ccid/highspeed-usb"]

# SCSI mass storage over Bulk Only Transport. The block device backing it is
# provided by the runner.
storage = ["dep:cipher", "dep:usbd-storage", "dep:xts-mode"]

stm32n657 = ["dep:stm32n657-hal"]

log-all = []
log-none = []
log-trace = []
log-debug = []
log-info = []
log-warn = []
log-error = []
