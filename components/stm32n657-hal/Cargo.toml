[package]
name = "stm32n657-hal"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.13.0"
cortex-m = "0.7"
delog = "0.1.8"
embedded-hal = { version = "0.2", features = ["unproven"] }
fugit = "0.3"
nb = "0.1"
stm32n6 = { version = "0.16", default-features = false, features = ["stm32n657"] }

[features]

log-all = []
log-none = []
log-trace = []
log-info = []
log-debug = []
log-warn = []
log-error = []
