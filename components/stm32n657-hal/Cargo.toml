[package]
name = "stm32n657-hal"
version = "0.1.0"
edition = "2024"

[dependencies]
cipher = { version = "0.4", optional = true }
cortex-m = "0.7"
embedded-hal = { version = "0.2", features = ["unproven"] }
fugit = "0.3"
nb = "0.1"
rand_core = "0.6"
stm32n6 = { version = "0.16", default-features = false, features = ["stm32n657"] }
synopsys-usb-otg = { version = "0.5", optional = true, features = ["hs"] }
delog.workspace = true
bitflags.workspace = true

[features]
default = ["cryp", "otg", "saes"]

cryp = ["dep:cipher"]
otg = ["dep:synopsys-usb-otg"]
saes = ["dep:cipher"]

log-all = []
log-none = []
log-trace = []
log-debug = []
log-info = []
log-warn = []
log-error = []
