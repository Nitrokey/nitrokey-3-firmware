[package]
name = "fm11nt08c"
edition = "2024"
version = "0.1.0"


[dependencies]
delog = "0.1.0"
embedded-time = "0.12"
nb = "1"
nfc-device = {path = "../nfc-device"}
embedded-hal = { version = "0.2.7", features = ["unproven"] }
bitfield = "0.19.3"
lpc55-hal-06 = { package = "lpc55-hal", version = "0.6.0", optional = true }
bitflags = "2.10.0"
hex-literal = "1"

[features]
default = ["log-all"]

log-all = []
log-none = []
log-trace = []
log-debug = []
log-info = []
log-warn = []
log-error = []

"lpc55-v0.6" = ["dep:lpc55-hal-06"]
